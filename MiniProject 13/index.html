<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #151515;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 450px;
    background: #222;
    padding: 40px 30px;
    border-radius: 16px;
    text-align: center;
    border: 1px solid #333;
}

.card h1 {
    color: white;
    font-size: 28px;
    margin-bottom: 10px;
}

.card p {
    color: #999;
    font-size: 16px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    margin-bottom: 15px;
    background: #181818;
    color: white;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #888;
}

button {
    width: 100%;
    height: 50px;
    margin-top: 5px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #222;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

#hasil {
    margin-top: 25px;
    margin-bottom: 0;
    color: white;
    font-size: 17px;
    font-weight: bold;
}
</style>

<div class="home">
  <div class="card">
    
    <h1>Temukan Genre Game Kamu</h1>
    <p>Dev : DkzySqwnzy</p>
    
    <input type="text" id="nama" placeholder="Masukan Nama"><br><br>
    <input type="text" id="genre" placeholder="Masukan Genre Game"><br><br>
    <button onclick="cekGenre()">Cek</button>
    
    <p id="hasil"></p>
    
  </div>
</div>

<script>
  function cekGenre(){
    const nama = document.getElementById("nama").value;
    const genre = document.getElementById("genre").value;
    const hasil = document.getElementById("hasil");
    
    if (genre === "olahraga" || genre === "sport"){
      hasil.textContent = "Halo ," + nama + " genre game kamu adalah Sport";
      
    } else if (genre === "aksi" || genre === "action"){
      hasil.textContent = "Halo ," + nama + " genre game kamu adalah Action";
      
    } else if (genre === "role playing" || genre === "rpg"){
      hasil.textContent = "Halo ," + nama + " genre game kamu adalah Rpg";
      
    } else if (genre === "balapan" || genre === "racing"){
      hasil.textContent = "Halo ," + nama +" genre game kamu adalah Racing";
      
    } else {
      hasil.textContent = "Halo ," + nama + " genre game kamu belum tersedia"
    }
}
</script>
