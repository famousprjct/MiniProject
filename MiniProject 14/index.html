<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b, #0f766e);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
}

/* Card utama */
.card {
    width: 100%;
    max-width: 480px;
    padding: 45px 35px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

/* Judul */
.card h1 {
    color: white;
    font-size: 30px;
    margin-bottom: 10px;
}

/* Deskripsi */
.card p {
    color: #cbd5e1;
    font-size: 16px;
    margin-bottom: 30px;
}

/* Input */
input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    margin-bottom: 15px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

/* Warna placeholder */
input::placeholder {
    color: #cbd5e1;
}

/* Saat input diklik */
input:focus {
    border-color: #2dd4bf;
    box-shadow: 0 0 12px rgba(45, 212, 191, 0.4);
}

/* Tombol */
button {
    width: 100%;
    height: 52px;
    margin-top: 5px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

/* Hover tombol */
button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(20, 184, 166, 0.35);
}

/* Saat tombol ditekan */
button:active {
    transform: translateY(0);
}

/* Hasil */
#hasil {
    margin-top: 25px;
    margin-bottom: 0;
    color: white;
    font-size: 17px;
    font-weight: bold;
}
</style>

<div class="home">
  <div class="card">
    
    <h1>Cek Harga Barang</h1>
    <p>Dev : DkzySqwnzy</p>
    
    <input type="text" id="barang" placeholder="Masukan Nama Barang"><br><br>
    <input type="number" id="harga" placeholder="Masukan Harga Barang"><br><br>
    <button onclick="cekHarga()">Cek</button>
    
    <p id="hasil"></p>
    
  </div>
</div>

<script>
  function cekHarga(){
    const barang = document.getElementById("barang").value;
    const harga = Number(document.getElementById("harga").value);
    const hasil = document.getElementById("hasil");
    
    if (harga >= 1000000 && harga <= 5000000){
      hasil.textContent = barang + " termasuk barang yang mahal";
      
    } else if (harga >= 500000 && harga <= 999999){
      hasil.textContent = barang + " termasuk barang menengah";
      
    } else if (harga >= 100000 && harga <= 499999){
      hasil.textContent = barang + " termasuk barang terjangkau";
      
    } else {
      hasil.textContent = barang + " termasuk barang murah";
    }
}
</script>
