</style>

<div class="home">
  <div class="card">
    
    <h1>Cek Nilai Dan Kelulusan</h1>
    <p>Dev : DkzySqwnzy</p>
    
    <input type="text" id="nama" placeholder="Masukan Nama"><br><br>
    <input type="number" id="nilai" placeholder="Masukan Nilai"><br><br>
    <button onclick="cekNk()">Cek</button>
    <p id="hasil"></p>
    
  </div>
</div>

<script>
  function cekNk(){
    const nama = document.getElementById("nama").value;
    const nilai = Number(document.getElementById("nilai").value);
    const hasil = document.getElementById("hasil");
    
    if (nama === "" || nilai < 0 || nilai > 100){
      hasil.textContent = "Halo Data Kamu Tidak Valid";
      
    } else if (nilai >= 90 && nilai <= 100){
      hasil.textContent = "Halo ," + nama + " nilai kamu sangat baik dan kamu Lulus";
      
    } else if (nilai >= 75 && nilai <= 89){
      hasil.textContent = "Halo ," + nama + " nilai kamu baik dan kamu Lulus";
      
    } else if (nilai >= 64 && nilai <= 74){
      hasil.textContent = "Halo ," + nama + " nilai kamu cukup dan kamu Lulus";
      
    } else {
      hasil.textContent = "Halo ," + nama + " nilai kamu kurang dan kamu Tidak Lulus";
    }
}
</script>
