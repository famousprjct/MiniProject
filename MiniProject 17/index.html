<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(56, 189, 248, 0.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(139, 92, 246, 0.35),
            transparent 35%
        ),
        #0f172a;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: Arial, sans-serif;
}

/* Container */
.home {
    width: 100%;
    display: flex;
    justify-content: center;
}

/* Card */
.card {
    width: 100%;
    max-width: 480px;

    padding: 45px 35px;

    background: rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.18);

    border-radius: 28px;

    text-align: center;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);

    transition: 0.3s;
}

/* Card Hover */
.card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(56, 189, 248, 0.08);
}

/* Icon */
.icon {
    width: 75px;
    height: 75px;

    margin: 0 auto 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 38px;

    background: rgba(56, 189, 248, 0.12);

    border: 1px solid rgba(56, 189, 248, 0.25);

    border-radius: 20px;

    box-shadow:
        0 0 25px rgba(56, 189, 248, 0.12);
}

/* Judul */
.card h1 {
    color: white;

    font-size: 30px;

    margin-bottom: 10px;
}

/* Deskripsi */
.card p {
    color: #94a3b8;

    font-size: 16px;

    margin-bottom: 30px;

    line-height: 1.6;
}

/* Input */
input {
    width: 100%;
    height: 54px;

    padding: 0 18px;

    margin-bottom: 15px;

    background: rgba(255, 255, 255, 0.06);

    color: white;

    border: 1px solid rgba(255, 255, 255, 0.15);

    border-radius: 14px;

    font-size: 16px;

    outline: none;

    transition: 0.3s;
}

/* Placeholder */
input::placeholder {
    color: #64748b;
}

/* Input Focus */
input:focus {
    border-color: #38bdf8;

    background: rgba(255, 255, 255, 0.1);

    box-shadow:
        0 0 0 3px rgba(56, 189, 248, 0.08),
        0 0 20px rgba(56, 189, 248, 0.15);
}

/* Button */
button {
    width: 100%;
    height: 54px;

    margin-top: 5px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #6366f1
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;

    box-shadow:
        0 10px 25px rgba(56, 189, 248, 0.15);
}

/* Button Hover */
button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 35px rgba(56, 189, 248, 0.3);
}

/* Button Active */
button:active {
    transform: translateY(0);
}

/* Hasil */
#hasil {
    margin-top: 25px;

    margin-bottom: 0;

    padding: 15px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    line-height: 1.6;

    background: rgba(255, 255, 255, 0.05);

    border: 1px solid rgba(255, 255, 255, 0.1);

    border-radius: 14px;
}
</style>

<div class="home">
  <div class="card">
    
    <div class="icon">🎓</div>
    <h1>Rekomendasi Minat Jurusan</h1>
    <p>Dev : DkzySqwnzy</p>
    
    <input type="text" id="nama" placeholder="Masukan Nama"><br><br>
    <input type="text" id="jurusan" placeholder="Masukan Minat"><br><br>
    <button onclick="cekRekomendasi()">Cek</button>
    
    <p id="hasil"></p>
    
  </div>
</div>

<script>
  function cekRekomendasi(){
    const nama = document.getElementById("nama").value;
    const jurusan = document.getElementById("jurusan").value;
    const hasil = document.getElementById("hasil");
    
    if (nama === "" || jurusan === ""){
      hasil.textContent = "Data Tidak Valid !!";
      
    } else if (jurusan === "mesin" || jurusan === "otomotif"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan Teknik Otomotif/TKR";
      
    } else if (jurusan === "coding" || jurusan === "koding"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan Informatika/PPLG";
      
    } else if (jurusan === "jaringan" || jurusan === "komputer"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan TKJ";
      
    } else if (jurusan === "desain" || jurusan === "design"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan DKV";
      
    } else if (jurusan === "hukum" || jurusan === "keadilan"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan Ilmu Hukum";
      
    } else if (jurusan === "vidio" || jurusan === "foto"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan Film Dan Televisi";
      
    } else if (jurusan === "seni" || jurusan === "alat musik"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk Jurusan Karawitan";
      
    } else if (jurusan === "bangunan" || jurusan === "membangun"){
      hasil.textContent = "Halo ," + nama + " kamu bisa masuk jurusan Arsitektur";
      
    } else {
      hasil.textContent = "Mohon Maaf,minat yang kamu miliki belum bisa kami proses di sistem"
    }
}
</script>
