<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(56, 189, 248, 0.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(139, 92, 246, 0.35),
            transparent 35%
        ),
        #0f172a;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: Arial, sans-serif;
}

/* Container */
.home {
    width: 100%;
    display: flex;
    justify-content: center;
}

/* Card */
.card {
    width: 100%;
    max-width: 460px;

    padding: 45px 35px;

    background: rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.18);

    border-radius: 28px;

    text-align: center;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);

    transition: 0.3s;
}

/* Hover Card */
.card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.5),
        0 0 35px rgba(56, 189, 248, 0.08);
}

/* Icon */
.icon {
    width: 75px;
    height: 75px;

    margin: 0 auto 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 38px;

    background: rgba(56, 189, 248, 0.12);

    border: 1px solid rgba(56, 189, 248, 0.25);

    border-radius: 20px;

    box-shadow:
        0 0 25px rgba(56, 189, 248, 0.15);
}

/* Judul */
.card h1 {
    color: white;

    font-size: 30px;

    margin-bottom: 10px;
}

/* Deskripsi */
.card p {
    color: #94a3b8;

    font-size: 16px;

    margin-bottom: 30px;

    line-height: 1.6;
}

/* Input */
input {
    width: 100%;
    height: 54px;

    padding: 0 18px;

    margin-bottom: 15px;

    background: rgba(255, 255, 255, 0.06);

    color: white;

    border: 1px solid rgba(255, 255, 255, 0.15);

    border-radius: 14px;

    font-size: 16px;

    outline: none;

    transition: 0.3s;
}

/* Placeholder */
input::placeholder {
    color: #64748b;
}

/* Input Focus */
input:focus {
    border-color: #38bdf8;

    background: rgba(255, 255, 255, 0.1);

    box-shadow:
        0 0 0 3px rgba(56, 189, 248, 0.08),
        0 0 20px rgba(56, 189, 248, 0.15);
}

/* Button */
button {
    width: 100%;
    height: 54px;

    margin-top: 5px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #6366f1
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;

    box-shadow:
        0 10px 25px rgba(56, 189, 248, 0.15);
}

/* Hover Button */
button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 35px rgba(56, 189, 248, 0.3);
}

/* Saat ditekan */
button:active {
    transform: translateY(0);
}

/* Hasil */
#hasil {
    margin-top: 25px;

    margin-bottom: 0;

    padding: 15px;

    color: white;

    font-size: 18px;

    font-weight: bold;

    line-height: 1.6;

    background: rgba(255, 255, 255, 0.05);

    border: 1px solid rgba(255, 255, 255, 0.1);

    border-radius: 14px;
}
</style>

<div class="home">
  <div class="card">
    
    <div class="icon">🔢</div>
    <h1>Cek Ganjil Genap</h1>
    <p>Dev : DkzySqwnzy</p>
    
    <input type="number" id="bilangan" placeholder="Masukan Bilangan"><br><br>
    <button onclick="cekGg()">Cek</button>
    
    <p id="hasil"></p>
    
  </div>
</div>

<script>
  function cekGg(){
    const bilangan = Number(document.getElementById("bilangan").value);
    const hasil = document.getElementById("hasil");
    
    if (bilangan % 2 === 0){
      hasil.textContent = "bilangan genap";
      
    } else {
      hasil.textContent = "bilangan ganjil"
    }
}
</script>
