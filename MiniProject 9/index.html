<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #eef7f1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
}

.card {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 45px 35px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
}

.card h1 {
    color: #16834e;
    font-size: 30px;
    margin-bottom: 15px;
}

.card p {
    color: #666;
    font-size: 17px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    margin-bottom: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #20a464;
}

button {
    width: 100%;
    height: 52px;
    margin-top: 5px;
    border: none;
    border-radius: 10px;
    background: #20a464;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #16834e;
}
</style>

<div class="home">
  <div class="card">
    
    <h1>Cek Kecepatan Internet</h1>
    <p>Dev : DkzySqwnzy</p>
    
    <input type ="number" id="kecepatan" placeholder="Masukan Kecepatan (Mbps)"><br><br>
    <button onclick="cekKecepatan()">Cek</button>
    
  </div>
</div>

<script>
  function cekKecepatan(){
    const kecepatan = Number(document.getElementById("kecepatan").value);
    
    if (kecepatan >= 50 && kecepatan <= 100){
      alert("Kecepatan internet kamu sangat cepat");
      
    } else if (kecepatan >= 10 && kecepatan <= 49){
      alert("Kecepatan internet kamu normal");
      
    } else {
      alert("Kecepatan internet mu sangat lambat/sangat cepat");
    }
}
  </script>
